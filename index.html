<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tap Tycoon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tap Tycoon</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { height:100%; overflow:hidden; touch-action:manipulation; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2a5e 0%, #0b1020 60%, #070a16 100%);
    color:#eef1ff;
    display:flex; flex-direction:column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  svg { display:block; }

  /* ---------- Top stats ---------- */
  #topbar { text-align:center; padding:10px 12px 6px; flex:0 0 auto; }
  #money {
    font-size: clamp(34px, 10vw, 48px); font-weight:800; letter-spacing:-1px;
    background: linear-gradient(180deg, #b9f6ca, #4ade80 55%, #16a34a);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow: 0 0 24px rgba(74,222,128,.25);
    transition: transform .08s;
  }
  #money.pop { transform: scale(1.04); }
  .chips { display:flex; justify-content:center; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .chip {
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
    border-radius:999px; padding:4px 12px; font-size:12.5px; color:#c7d0f0; font-weight:600;
  }
  .chip b { color:#ffe082; }
  .chip.prestige b { color:#c084fc; }

  /* ---------- Boost pills ---------- */
  #boosts { display:flex; justify-content:center; gap:6px; min-height:26px; margin-top:4px; flex-wrap:wrap; }
  .boostpill {
    background:linear-gradient(90deg,#7c3aed,#db2777); border-radius:999px;
    padding:3px 10px; font-size:12px; font-weight:700; box-shadow:0 2px 10px rgba(219,39,119,.4);
    animation: pulse 1s infinite alternate;
  }
  @keyframes pulse { from{opacity:.85} to{opacity:1} }

  /* ---------- Tap zone / character ---------- */
  #tapzone { flex:1 1 auto; position:relative; display:flex; align-items:flex-end; justify-content:center; min-height:150px; overflow:hidden; }
  #skyline { position:absolute; bottom:0; left:0; width:100%; height:52%; opacity:.55; pointer-events:none; }
  #avatar {
    position:relative; height:96%; max-height:340px; aspect-ratio:220/270;
    display:flex; align-items:flex-end; justify-content:center;
    cursor:pointer; transition: transform .06s; z-index:2;
  }
  #avatar.squish { transform: scale(.95); }
  #aura {
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%);
    width:105%; aspect-ratio:1; border-radius:50%; z-index:-1;
    background: radial-gradient(circle, rgba(255,255,255,.08) 0%, transparent 68%);
  }
  #aura.blue  { background: radial-gradient(circle, rgba(59,130,246,.4), transparent 68%); }
  #aura.purple{ background: radial-gradient(circle, rgba(168,85,247,.4), transparent 68%); }
  #aura.gold  { background: radial-gradient(circle, rgba(250,204,21,.42), transparent 68%); }
  #charSvg { width:100%; height:100%; filter: drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
  #taphint { position:absolute; bottom:6px; width:100%; text-align:center; font-size:12px; color:#8892b8; letter-spacing:.5px; z-index:3; pointer-events:none; }

  .float {
    position:absolute; font-weight:800; font-size:22px; color:#7CFC9A; pointer-events:none;
    text-shadow:0 2px 6px rgba(0,0,0,.6); animation: rise .9s ease-out forwards; z-index:5;
  }
  @keyframes rise { 0%{opacity:1; transform:translateY(0) scale(1)} 100%{opacity:0; transform:translateY(-90px) scale(1.25)} }
  .coinDot {
    width:22px; height:22px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffe082, #f59e0b 60%, #b45309);
    border:2px solid #92400e; box-shadow:0 2px 6px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:900; color:#7c2d12;
  }

  /* ---------- Shop ---------- */
  #shop {
    flex: 0 0 47%; display:flex; flex-direction:column;
    background:rgba(10,14,30,.92); border-top:1px solid rgba(255,255,255,.1);
    border-radius:22px 22px 0 0; box-shadow:0 -10px 30px rgba(0,0,0,.45);
  }
  #tabs { display:flex; flex:0 0 auto; padding:8px 6px 4px; gap:3px; }
  .tab {
    flex:1; text-align:center; padding:7px 0 6px; border-radius:12px; font-size:10px; font-weight:700;
    color:#8892b8; background:transparent; border:none; cursor:pointer;
  }
  .tab svg { width:21px; height:21px; margin:0 auto 2px; }
  .tab.active { background:rgba(255,255,255,.09); color:#fff; }
  #panel { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px 12px 20px; }

  .row {
    display:flex; align-items:center; gap:10px; padding:10px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
    border-radius:14px; margin-bottom:8px;
  }
  .row.done { border-color:rgba(250,204,21,.5); background:rgba(250,204,21,.08); }
  .row .icon { width:40px; height:40px; flex:0 0 auto; }
  .row .icon svg { width:100%; height:100%; }
  .row .info { flex:1 1 auto; min-width:0; }
  .row .name { font-weight:700; font-size:14px; }
  .row .name .owned { color:#ffd54f; font-size:12px; margin-left:6px; }
  .row .desc { font-size:11.5px; color:#9aa5c9; margin-top:2px; }
  .bar { height:5px; border-radius:99px; background:rgba(255,255,255,.1); margin-top:6px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#4ade80,#22c55e); transition:width .3s; }
  .bar.gold i { background:linear-gradient(90deg,#fde68a,#f59e0b); }
  .buy {
    flex:0 0 auto; min-width:86px; padding:9px 10px; border:none; border-radius:12px;
    font-weight:800; font-size:13px; color:#06230f; cursor:pointer;
    background:linear-gradient(180deg,#6ee7a0,#22c55e); box-shadow:0 3px 0 #15803d;
  }
  .buy:active { transform:translateY(2px); box-shadow:0 1px 0 #15803d; }
  .buy:disabled { background:#2a3352; color:#697199; box-shadow:none; }
  .buy.equipped { background:linear-gradient(180deg,#93c5fd,#3b82f6); box-shadow:0 3px 0 #1d4ed8; color:#eff6ff; }
  .buy.free { background:linear-gradient(180deg,#fde68a,#f59e0b); box-shadow:0 3px 0 #b45309; color:#451a03; }
  .sectionTitle { font-size:12px; font-weight:800; color:#8892b8; letter-spacing:1px; margin:10px 2px 6px; text-transform:uppercase; }

  /* ---------- Buy amount selector ---------- */
  #amtRow { display:flex; align-items:center; gap:6px; margin:4px 2px 10px; }
  #amtRow span { font-size:11px; color:#8892b8; font-weight:700; }
  .amtBtn {
    padding:6px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05); color:#aeb8dd; font-weight:800; font-size:12px; cursor:pointer;
  }
  .amtBtn.active { background:linear-gradient(180deg,#6ee7a0,#22c55e); color:#06230f; border-color:transparent; }

  /* ---------- Prestige card ---------- */
  #prestigeCard {
    background:linear-gradient(135deg, rgba(124,58,237,.25), rgba(219,39,119,.15));
    border:1px solid rgba(168,85,247,.45); border-radius:16px; padding:14px; margin-bottom:12px;
  }
  #prestigeCard h3 { font-size:15px; margin-bottom:4px; }
  #prestigeCard p { font-size:12px; color:#c4b5fd; margin-bottom:8px; }
  #prestigeBtn {
    width:100%; padding:12px; border:none; border-radius:12px; font-weight:800; font-size:14px; cursor:pointer;
    background:linear-gradient(180deg,#c084fc,#9333ea); box-shadow:0 3px 0 #6b21a8; color:#faf5ff;
  }
  #prestigeBtn:disabled { background:#2a3352; color:#697199; box-shadow:none; }

  /* ---------- Stats / settings ---------- */
  .statrow { display:flex; justify-content:space-between; padding:10px 4px; border-bottom:1px solid rgba(255,255,255,.07); font-size:14px; }
  .statrow b { color:#ffe082; }
  .settingsBtn {
    width:100%; padding:12px; margin-top:10px; border-radius:12px; border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.06); color:#eef1ff; font-weight:700; font-size:14px; cursor:pointer;
  }
  .settingsBtn.danger { border-color:#7f1d1d; background:rgba(220,38,38,.15); color:#fca5a5; }

  /* ---------- Modal ---------- */
  #modal {
    position:fixed; inset:0; background:rgba(0,0,0,.7); display:none;
    align-items:center; justify-content:center; z-index:50; padding:24px;
  }
  #modal.show { display:flex; }
  #modalCard {
    background:linear-gradient(180deg,#1c2547,#111731); border:1px solid rgba(255,255,255,.15);
    border-radius:20px; padding:26px 22px; text-align:center; max-width:320px; width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  #modalCard .big { width:64px; height:64px; margin:0 auto; }
  #modalCard h2 { margin:8px 0 4px; font-size:20px; }
  #modalCard p { color:#aeb8dd; font-size:14px; margin-bottom:16px; }
  #modalCard .gain { color:#4ade80; font-weight:800; font-size:22px; }
  #modalBtn {
    width:100%; padding:13px; border:none; border-radius:14px; font-weight:800; font-size:15px;
    background:linear-gradient(180deg,#6ee7a0,#22c55e); box-shadow:0 3px 0 #15803d; color:#06230f; cursor:pointer;
  }
  #toast {
    position:fixed; top:14%; left:50%; transform:translateX(-50%);
    background:rgba(20,26,52,.95); border:1px solid rgba(255,255,255,.2); border-radius:999px;
    padding:8px 18px; font-size:13px; font-weight:700; opacity:0; transition:opacity .25s; z-index:60; pointer-events:none;
    white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis;
  }
  #toast.show { opacity:1; }
</style>
</head>
<body>

<script>
"use strict";

/* ================= Vector icon set ================= */

function svg40(inner) { return '<svg viewBox="0 0 40 40">' + inner + '</svg>'; }
const ICONS = {
  lemonade: svg40('<path d="M12,12 L28,12 L25,34 L15,34 Z" fill="#fef9c3" stroke="#eab308" stroke-width="2.5" stroke-linejoin="round"/><path d="M13.5,18 L26.5,18 L25,30.5 L15,30.5 Z" fill="#fde047"/><path d="M22,12 L28,3" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/><circle cx="30" cy="8" r="5.5" fill="#fde047" stroke="#ca8a04" stroke-width="2"/><path d="M30,3.5 L30,12.5 M25.5,8 L34.5,8" stroke="#ca8a04" stroke-width="1.5"/>'),

};

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      S = Object.assign(S, d);
      S.equipped = Object.assign({ hat:null, glasses:null, chain:null, aura:null }, d.equipped);
      if (d.runEarned === undefined) S.runEarned = S.totalEarned;
    }
  } catch (e) { /* corrupted save -> start fresh */ }
}
function save() {
  S.lastSeen = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}

/* ================= Derived values ================= */

function bizTotal()   { return Object.values(S.biz).reduce((a, b) => a + b, 0); }
function powerTotal() { return Object.values(S.powerBuys).reduce((a, b) => a + b, 0); }

function clothingBonus(kind) {
  let mult = 1;
  for (const slot in S.equipped) {
    const id = S.equipped[slot];
    if (!id) continue;
    const c = CLOTHING.find(c => c.id === id);
    if (c && c.bonus[kind]) mult += c.bonus[kind];
  }
  return mult;
}
function achBonus() {
  let mult = 1;
  for (const id of S.ach) {
    const a = ACHIEVEMENTS.find(a => a.id === id);
    if (a) mult += a.reward;
  }
  return mult;
}
function prestigeBonus() { return 1 + S.prestigePoints * PRESTIGE_BONUS; }
function globalMult() { return achBonus() * prestigeBonus() * clothingBonus("all"); }

function boostMult(kind) {
  const now = Date.now();
  let mult = 1;
  for (const ab of S.activeBoosts) {
    if (ab.until <= now) continue;
    const p = POWERUPS.find(p => p.id === ab.id);
    if (!p) continue;
    if (kind === "tap") mult *= p.tapMult;
    else mult *= p.allMult;
  }
  return mult;
}

function tapValue() {
  let v = 1;
  for (const u of UPGRADES) v += u.add * (S.ups[u.id] || 0);
  return v * clothingBonus("tap") * globalMult() * boostMult("tap");
}
function milestoneMult(count) { return Math.pow(2, Math.floor(count / MILESTONE)); }
function perSec() {
  let v = 0;
  for (const b of BUSINESSES) {
    const count = S.biz[b.id] || 0;
    v += b.inc * count * milestoneMult(count);
  }
  return v * clothingBonus("passive") * globalMult() * boostMult("all");
}

function seriesCost(base, growth, owned, n) {
  return Math.ceil(base * Math.pow(growth, owned) * (Math.pow(growth, n) - 1) / (growth - 1));
}
function maxAffordable(base, growth, owned) {
  const first = base * Math.pow(growth, owned);
  if (S.money < first) return 0;
  const n = Math.floor(Math.log(S.money * (growth - 1) / first + 1) / Math.log(growth));
  return Math.max(1, n);
}
function bulkInfo(base, growth, owned) {
  let n = S.buyAmt === "max" ? maxAffordable(base, growth, owned) : S.buyAmt;
  if (n < 1) n = 1;
  return { n, cost: seriesCost(base, growth, owned, n) };
}

function powerCost(p) {
  const ps = perSec(), tv = tapValue();
  switch (p.id) {
    case "coffee": return Math.max(500,  Math.round(ps * 45 + tv * 30));
    case "frenzy": return Math.max(2500, Math.round(ps * 120 + tv * 60));
    case "rain":   return Math.max(1000, Math.round((tv * 100 + ps * 300) * 0.6));
    case "warp":   return Math.max(5000, Math.round(ps * 1800));
    default: return 1e9;
  }
}

function prestigeGain() {
  return Math.floor(Math.sqrt(S.runEarned / PRESTIGE_REQ));
}

/* ================= Money helpers ================= */

const SUFFIXES = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp"];
function fmt(n) {
  if (n < 0) return "-" + fmt(-n);
  if (n < 1000) return "$" + Math.floor(n);
  let tier = Math.floor(Math.log10(n) / 3);
  tier = Math.min(tier, SUFFIXES.length - 1);
  const scaled = n / Math.pow(10, tier * 3);
  return "$" + (scaled >= 100 ? Math.floor(scaled) : scaled.toFixed(scaled >= 10 ? 1 : 2)) + SUFFIXES[tier];
}

function earn(amount) {
  S.money += amount;
  S.totalEarned += amount;
  S.runEarned += amount;
}
function spend(amount) {
  if (S.money < amount) return false;
  S.money -= amount;
  return true;
}

/* ================= Audio & haptics ================= */

let audioCtx = null;
function blip(freq, dur, vol) {
  if (!S.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function buzz(ms) {
  if (S.haptics && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
}

      ICONS[b.id], b.name,

      count ? "×" + count : "", "",
      () => {
        const { n, cost } = bulkInfo(b.cost, BIZ_GROWTH, S.biz[b.id] || 0);

function dailyAvailable() { return S.lastDaily !== new Date().toDateString(); }

function renderBoosts() {
  const avail = dailyAvailable();
  const gift = makeRow(ICONS.gift, "Daily Gift", avail ? "Free cash + a free Golden Frenzy. Every day!" : "Come back tomorrow for more!",
    "", avail ? "FREE" : "✓ Claimed",
    () => {
      if (!dailyAvailable()) return;
      S.lastDaily = new Date().toDateString();
      const gain = Math.max(1000, perSec() * 1800 + tapValue() * 200);
      earn(gain);
      const now = Date.now();
      const existing = S.activeBoosts.find(ab => ab.id === "frenzy");
      if (existing) existing.until = Math.max(existing.until, now) + 30000;
      else S.activeBoosts.push({ id:"frenzy", until: now + 30000 });
      buzz([30, 40, 30]); blip(880, 0.2, 0.1);
      toast("Daily Gift: +" + fmt(gain) + " and Golden Frenzy!");
      rainCoins();
      save(); renderTab(); updateHUD();
    });
  if (avail) gift.btn.classList.add("free");
  else gift.btn.disabled = true;
  panelEl.appendChild(gift.row);

  for (const p of POWERUPS) {
    const { row, btn } = makeRow(
      ICONS[p.icon], p.name, p.desc, "", fmt(powerCost(p)),
      () => {
        const cost = powerCost(p);
        if (!spend(cost)) return;
        S.powerBuys[p.id] = (S.powerBuys[p.id] || 0) + 1;
        if (p.type === "boost") {
          const now = Date.now();
          const existing = S.activeBoosts.find(ab => ab.id === p.id);
          if (existing) existing.until = Math.max(existing.until, now) + p.dur * 1000;
          else S.activeBoosts.push({ id: p.id, until: now + p.dur * 1000 });
          toast(p.name + " active!");
        } else if (p.id === "rain") {
          const gain = tapValue() * 100 + perSec() * 300;
          earn(gain);
          toast("Money Rain: +" + fmt(gain) + "!");
          rainCoins();
        } else if (p.id === "warp") {
          const gain = perSec() * 3600;
          earn(gain);
          toast("Time Warp: +" + fmt(gain) + "!");
        }
        buzz([30, 40, 30]); blip(880, 0.2, 0.1);
        save(); renderTab(); updateHUD();

    );
    liveRows.push({ btn, getCost: () => powerCost(p), getLabel: () => fmt(powerCost(p)) });

    panelEl.appendChild(title);

      const { row, btn } = makeRow(ICONS[c.id], c.name, c.desc, "", btnText, () => {

          buzz(25); blip(760, 0.15, 0.1);

function offlineEarnings() {
  const elapsed = Math.min((Date.now() - S.lastSeen) / 1000, OFFLINE_CAP_SEC);
  if (elapsed < 60) return;
  const gain = perSec() * elapsed;
  if (gain < 1) return;
  earn(gain);
  const mins = Math.round(elapsed / 60);
  $("modalEmoji").innerHTML = ICONS.coin;
  $("modalTitle").textContent = "Welcome back!";
  $("modalText").textContent = "Your businesses worked for " + (mins >= 60 ? Math.floor(mins / 60) + "h " + (mins % 60) + "m" : mins + " min") + " while you were away.";
  $("modalGain").textContent = "+" + fmt(gain);
  $("modal").classList.add("show");
}
$("modalBtn").addEventListener("click", () => {
  $("modal").classList.remove("show");
  buzz(20); blip(880, 0.2, 0.1);
  save();
});

/* ================= Game loop ================= */

let lastTick = Date.now();
setInterval(() => {
  const now = Date.now();
  const dt = Math.min((now - lastTick) / 1000, 5);
  lastTick = now;
  const ps = perSec();
  if (ps > 0) earn(ps * dt);
  updateHUD();
  updateBoostPills();
  refreshRows();
}, 200);

setInterval(checkAchievements, 1000);
setInterval(save, 3000);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
window.addEventListener("pagehide", save);

document.addEventListener("dblclick", e => e.preventDefault(), { passive:false });
document.addEventListener("contextmenu", e => e.preventDefault());

/* ================= Boot ================= */

load();
offlineEarnings();
updateAvatar();
updateHUD();
renderTab();
checkAchievements();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
