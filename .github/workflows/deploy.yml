name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths: [www/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push www content to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SPLIT=$(git subtree split --prefix www)
          git push origin "$SPLIT:refs/heads/gh-pages" --force
