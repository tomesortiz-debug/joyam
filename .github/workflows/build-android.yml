name: Build Android app

on:
  push:
    branches: [main]
    paths: [www/**, android/**, capacitor.config.json, package.json, .github/workflows/build-android.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies and sync web assets
        run: |
          npm ci
          npx cap sync android

      - name: Decode signing keystore (if configured)
        if: ${{ vars.SIGNING_ENABLED == 'true' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/upload-keystore.jks

      - name: Build release AAB and APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ vars.SIGNING_ENABLED == 'true' && format('{0}/upload-keystore.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PATH" ]; then unset KEYSTORE_PATH; fi
          ./gradlew bundleRelease assembleRelease assembleDebug --no-daemon

      - name: Upload Play Store bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: tap-tycoon-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release*.aab

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tap-tycoon-release-apk
          path: android/app/build/outputs/apk/release/app-release*.apk

      - name: Upload debug APK (installable for testing)
        uses: actions/upload-artifact@v4
        with:
          name: tap-tycoon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the "latest" release (one-tap phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TapTycoon.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest TapTycoon.apk \
            --title "Tap Tycoon — latest Android build" \
            --notes "Direct install (no Play Store needed):

          1. Open this page on your Android phone and tap **TapTycoon.apk** below.
          2. When prompted, allow your browser to install unknown apps.
          3. Open Tap Tycoon from your home screen. Progress saves on your device.

          Built automatically from the latest code on main."
